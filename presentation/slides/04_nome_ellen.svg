, sans-serif" font-size="38" font-weight="450">Pioneira em química sanitária,</text><text x="109" y="683" fill="#E5F6F1" fill-opacity="1" font-family="Inter, Inter Display, Arial, sans-serif" font-size="38" font-weight="450">estudou a qualidade da água</text><text x="109" y="740" fill="#E5F6F1" fill-opacity="1" font-family="Inter, Inter Display, Arial, sans-serif" font-size="38" font-weight="450">e a relação entre ambiente,</text><text x="109" y="797" fill="#E5F6F1" fill-opacity="1" font-family="Inter, Inter Display, Arial, sans-serif" font-size="38" font-weight="450">alimentação e saúde.</text><rect x="1084" y="215" width="610" height="620" rx="28" fill="#15353A" fill-opacity="1" stroke="#2D625C" stroke-width="2"/><circle cx="1390" cy="483" r="185" fill="none" stroke="#4C9990" stroke-width="3" opacity="0.6"/><path d="M 1385 304 C 1278 350 1292 440 1334 481 C 1292 520 1243 548 1232 695 L 1552 695 C 1546 570 1493 520 1447 477 C 1508 415 1470 321 1385 304 Z" fill="#3F8C80" stroke="none" stroke-width="0" opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1301 432 Q 1355 465 1464 434 M 1341 567 Q 1401 595 1500 550" fill="none" stroke="#A5D8C6" stroke-width="8" opacity="0.5" stroke-linecap="round" stroke-linejoin="round"/><text x="1390" y="771" fill="#8CE9D1" fill-opacity="1" font-family="Inter, Inter Display, Arial, sans-serif" font-size="22" font-weight="760" text-anchor="middle" letter-spacing="1.8">CIÊNCIA A SERVIÇO DA VIDA</text><text x="107" y="914" fill="#98BCB4" fill-opacity="1" font-family="Inter, Inter Display, Arial, sans-serif" font-size="23" font-weight="550">Inspirada na trajetória documentada pelo MIT e pelo Science History Institute.</text></svg>