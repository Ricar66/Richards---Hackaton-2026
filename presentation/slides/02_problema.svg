    </defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#0A1720" fill-opacity="1" stroke="none" stroke-width="1"/><circle cx="1590" cy="430" r="400" fill="url(#glow)" stroke="none" stroke-width="1" opacity="1"/><circle cx="1460" cy="410" r="248.0" fill="none" stroke="#327F78" stroke-width="3" opacity="0.45"/><circle cx="1460" cy="410" r="312.0" fill="none" stroke="#327F78" stroke-width="2" opacity="0.25"/><text x="102" y="81" fill="#E2F4ED" fill-opacity="1" font-family="Inter, Inter Display, Arial, sans-serif" font-size="24" font-weight="760" letter-spacing="3.2">RICHARDS  /  INTELLIGENCE</text><line x1="102" y1="104" x2="1818" y2="104" stroke="#2A4548" stroke-width="2" stroke-opacity="1"/><text x="102" y="1025" fill="#78928F" fill-opacity="1" font-family="Inter, Inter Display, Arial, sans-serif" font-size="19" font-weight="680" letter-spacing="2.2">HACKATHON SENAC 2026</text><text x="1818" y="1025" fill="#78928F" fill-opacity="1" font-family="Inter, Inter Display, Arial, sans-serif" font-size="19" font-weight="680" text-anchor="end" letter-spacing="2">02 / 14</text><text x="103" y="215" fill="#8CE9D1" fill-opacity="1" font-family="Inter, Inter Display, Arial, sans-serif" font-size="27" font-weight="800" letter-spacing="4">O PROBLEMA</text><text x="101" y="340" fill="#FFFFFF" fill-opacity="1" font-family="Inter, Inter Display, Arial, sans-serif" font-size="92" font-weight="790">Quanto custa perceber</text><text x="101" y="448" fill="#FFFFFF" fill-opacity="1" font-family="Inter, Inter Display, Arial, sans-serif" font-size="92" font-weight="790">tarde demais?</text><rect x="103" y="591" width="790" height="270" rx="22" fill="#16373B" fill-opacity="1" stroke="#2E6864" stroke-width="2"/><text x="143" y="664" fill="#8CE9D1" fill-opacity="1" font-family="Inter, Inter Display, Arial, sans-serif" font-size="26" font-weight="740" letter-spacing="3">01  ÁGUA</text><text x="143" y="737" fill="#F1F9F4" fill-opacity="1" font-family="Inter, Inter Display, Arial, sans-serif" font-size="35" font-weight="480">Um fluxo incomum continua.</text><text x="143" y="790" fill="#F1F9F4" fill-opacity="1" font-family="Inter, Inter Display, Arial, sans-serif" font-size="35" font-weight="480">Ninguém percebe. O tempo passa.</text><rect x="922" y="591" width="790" height="270" rx="22" fill="#16373B" fill-opacity="1" stroke="#2E6864" stroke-width="2"/><text x="962" y="664" fill="#8CE9D1" fill-opacity="1" font-family="Inter, Inter Display, Arial, sans-serif" font-size="26" font-weight="740" letter-spacing="3">02  ALIMENTOS</text><text x="962" y="737" fill="#F1F9F4" fill-opacity="1" font-family="Inter, Inter Display, Arial, sans-serif" font-size="35" font-weight="480">Um excedente perde a janela</text><text x="962" y="790" fill="#F1F9F4" fill-opacity="1" font-family="Inter, Inter Display, Arial, sans-serif" font-size="35" font-weight="480">de aproveitamento e de destino.</text><text x="107" y="925" fill="#E6B468" fill-opacity="1" font-family="Inter, Inter Display, Arial, sans-serif" font-size="33" font-weight="640">A perda cresce no intervalo entre o sinal e a decisão.</text></svg>