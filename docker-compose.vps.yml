# Publicação na VPS da Tétria pelo Coolify, no mesmo padrão de recurso da Elora.
# Roteiro completo: docs/DEPLOY_VPS_TETRIA.md. NÃO usar no notebook: lá o plano B é o docker-compose.yml.
# - Decisão do Ricardo em 06/11/2026: acesso direto por IP, sem subdomínio nem Cloudflare Access:
#   http://187.77.229.205:8090. A porta publicada pelo Docker passa por cima do ufw, por isso abre sem regra nova.
#   Para voltar ao modelo da Elora (túnel + Access), troque por "127.0.0.1:<porta livre>:3000".
#   A 18082 do primeiro roteiro é do woodpecker-server; confira com `ss -ltnp` antes.
# - O banco não tem porta no host.
# - Segredos vêm das variáveis do recurso no Coolify; ":?" derruba o deploy se faltar (nunca sobe com senha de laboratório).
services:
  richards-db:                      # nome único: não colide com o alias "db" de outras stacks da VPS
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: richards
      POSTGRES_PASSWORD: ${VPS_POSTGRES_PASSWORD:?defina VPS_POSTGRES_PASSWORD}
      POSTGRES_DB: richards
    volumes:
      - richards_vps_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U richards -d richards"]
      interval: 5s
      timeout: 3s
      retries: 12
  web:
    build: .
    restart: unless-stopped
    depends_on:
      richards-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://richards:${VPS_POSTGRES_PASSWORD:?defina VPS_POSTGRES_PASSWORD}@richards-db:5432/richards?schema=public
      # Demonstração de hackathon: todo o seed é SIMULATED. Senha forte e própria da VPS (nunca a de laboratório do notebook).
      DEMO_MODE: "true"
      AUTH_MODE: basic
      RICHARDS_OPERATOR_USER: ${VPS_OPERATOR_USER:?defina VPS_OPERATOR_USER}
      RICHARDS_OPERATOR_PASSWORD: ${VPS_OPERATOR_PASSWORD:?defina VPS_OPERATOR_PASSWORD}
      IOT_DEMO_DEVICE_KEY: ${VPS_IOT_DEVICE_KEY:?defina VPS_IOT_DEVICE_KEY}
      # RICHARDS Assist (PR #6): DESLIGADO por padrão; liga só com as variáveis VPS_* no Coolify (segredos nunca no git).
      # O site precisa delas para a tela /assistente, a conversa e o código de vínculo do Telegram.
      ASSISTANT_ENABLED: ${VPS_ASSISTANT_ENABLED:-false}
      OPENAI_API_KEY: ${VPS_OPENAI_API_KEY:-}
      OPENAI_MODEL: ${VPS_OPENAI_MODEL:-gpt-4.1-mini}
      ASSISTANT_DAILY_REQUEST_LIMIT: ${VPS_ASSISTANT_DAILY_REQUEST_LIMIT:-100}
      ASSISTANT_MINUTE_REQUEST_LIMIT: ${VPS_ASSISTANT_MINUTE_REQUEST_LIMIT:-6}
      TELEGRAM_ENABLED: ${VPS_TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${VPS_TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${VPS_TELEGRAM_BOT_USERNAME:-}
      ASSISTANT_BASE_URL: ${VPS_ASSISTANT_BASE_URL:-http://187.77.229.205:8090}
    healthcheck:
      # 127.0.0.1 e não localhost: no alpine "localhost" pode resolver para ::1. A imagem tem wget (busybox), não curl.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 120s
    ports:
      # VPS_BIND_ADDR: 0.0.0.0 (padrão, acesso direto por IP em http) ou 127.0.0.1 (só o túnel/proxy local alcança).
      # Trocar = mudar a variável no Coolify e fazer Redeploy; voltar = o mesmo, ao contrário. Ver docs/DEPLOY_VPS_TETRIA.md.
      - "${VPS_BIND_ADDR:-0.0.0.0}:8090:3000"

  # ---- Broker MQTT da bancada do Victor (autorizado pelo Ricardo em 06/11; ideia do PR #4) ----
  # Usuário e senha obrigatórios (sem anônimo) e ACL: o dispositivo só ESCREVE no tópico da bancada e no próprio; a
  # ponte só LÊ. Risco aceito até 08/11: MQTT sem TLS (a senha trafega aberta). Desmontar e trocar as senhas depois.
  # A porta publicada pelo Docker passa por cima do ufw: 1883 fica aberta na internet (por isso a senha e a ACL).
  richards-mqtt:
    build: ./mosquitto
    restart: unless-stopped
    environment:
      MQTT_TOPIC: richards/comercio/telemetria
      MQTT_BRIDGE_USER: richards-ponte
      MQTT_BRIDGE_PASSWORD: ${VPS_MQTT_BRIDGE_PASSWORD:?defina VPS_MQTT_BRIDGE_PASSWORD}
      MQTT_DEVICE_USER: ${VPS_MQTT_DEVICE_USER:-hortifruti_01}
      MQTT_DEVICE_PASSWORD: ${VPS_MQTT_DEVICE_PASSWORD:?defina VPS_MQTT_DEVICE_PASSWORD}
    ports:
      - "${VPS_MQTT_BIND_ADDR:-0.0.0.0}:1883:1883"
  # A ponte (`pnpm mqtt`) é quem grava: mesmos casos de uso do HTTP, fila com retentativa e carta morta.
  richards-ponte:
    build: .
    command: ["pnpm", "mqtt"]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      richards-mqtt:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://richards:${VPS_POSTGRES_PASSWORD:?defina VPS_POSTGRES_PASSWORD}@richards-db:5432/richards?schema=public
      DEMO_MODE: "true"
      MQTT_BROKER_URL: mqtt://richards-mqtt:1883
      MQTT_USERNAME: richards-ponte
      MQTT_PASSWORD: ${VPS_MQTT_BRIDGE_PASSWORD:?defina VPS_MQTT_BRIDGE_PASSWORD}
      MQTT_TOPIC: richards/comercio/telemetria
      # Só o tópico do próprio dispositivo (a ACL do broker garante quem publica nele): o JSON não fala por outro.
      MQTT_REQUIRE_DEVICE_TOPIC: "true"
      MQTT_DEVICE_ALIASES: ${VPS_MQTT_DEVICE_ALIASES:-hortifruti_01=RICHARDS-FLOW-001}
      # Potenciômetro no lugar do YF-S201 (confirmado pelo Victor em 06/11): a vazão sai carimbada SIMULADO.
      MQTT_SIMULATED_SENSORS: ${VPS_MQTT_SIMULATED_SENSORS:-VAZAO}
      # HX711 física tem capacidade nominal 5 kg; limiar de demo 1,5 kg após tara/calibração.
      MQTT_SCALE_MIN_KG: ${VPS_MQTT_SCALE_MIN_KG:-1.5}
      MQTT_SCALE_STABLE_SECONDS: ${VPS_MQTT_SCALE_STABLE_SECONDS:-6}
      MQTT_DEAD_LETTER: /data/carta-morta.ndjson
    volumes:
      - richards_vps_mqtt:/data
  # Worker do RICHARDS Assist: alertas e conversa do Telegram por polling (getUpdates): NÃO abre porta e não usa webhook.
  # Um só por banco (advisory lock). on-failure: com o Telegram desligado ele sai com sucesso e fica parado (unless-stopped
  # reiniciaria sem fim); se cair por erro, o Docker reinicia com espera crescente.
  richards-assistente:
    build: .
    command: ["node", "--import", "tsx", "src/assistant/run-assistant.ts"]
    restart: on-failure
    depends_on:
      web:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://richards:${VPS_POSTGRES_PASSWORD:?defina VPS_POSTGRES_PASSWORD}@richards-db:5432/richards?schema=public
      ASSISTANT_ENABLED: ${VPS_ASSISTANT_ENABLED:-false}
      OPENAI_API_KEY: ${VPS_OPENAI_API_KEY:-}
      OPENAI_MODEL: ${VPS_OPENAI_MODEL:-gpt-4.1-mini}
      ASSISTANT_DAILY_REQUEST_LIMIT: ${VPS_ASSISTANT_DAILY_REQUEST_LIMIT:-100}
      ASSISTANT_MINUTE_REQUEST_LIMIT: ${VPS_ASSISTANT_MINUTE_REQUEST_LIMIT:-6}
      TELEGRAM_ENABLED: ${VPS_TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${VPS_TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${VPS_TELEGRAM_BOT_USERNAME:-}
      ASSISTANT_BASE_URL: ${VPS_ASSISTANT_BASE_URL:-http://187.77.229.205:8090}
      ASSISTANT_ESCALATION_MINUTES: ${VPS_ASSISTANT_ESCALATION_MINUTES:-15}
      ASSISTANT_SUMMARY_HOUR: ${VPS_ASSISTANT_SUMMARY_HOUR:-8}
    healthcheck:
      test: ["CMD", "node", "--import", "tsx", "src/assistant/health.ts"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
volumes:
  richards_vps_pgdata:
  richards_vps_mqtt:
