# Broker da bancada RICHARDS. Só usuário com senha; cada usuário só faz o que a ACL deixa (ver entrypoint.sh).
# Sem persistência: a ponte usa sessão limpa (o JSON do firmware não traz horário; ver docs/CONTRATO_IOT.md).
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl
persistence false
# Leituras são JSON pequenos: pacote grande é recusado na porta.
max_packet_size 4096
max_queued_messages 1000
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
