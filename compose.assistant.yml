# Recurso opcional, não usado no deploy ativo. Aplicar só após revisão/migração em homologação.
# docker compose -f docker-compose.yml -f compose.assistant.yml --profile assistente up -d --build
services:
  web:
    environment:
      ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      ASSISTANT_DAILY_REQUEST_LIMIT: ${ASSISTANT_DAILY_REQUEST_LIMIT:-200}
      ASSISTANT_MINUTE_REQUEST_LIMIT: ${ASSISTANT_MINUTE_REQUEST_LIMIT:-6}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      ASSISTANT_BASE_URL: ${ASSISTANT_BASE_URL:-}
  assistente:
    profiles: ["assistente"]
    build: .
    command: ["node", "--import", "tsx", "src/assistant/run-assistant.ts"]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://richards:${POSTGRES_PASSWORD:-richards_dev_change_me}@db:5432/richards?schema=public"
      ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      ASSISTANT_DAILY_REQUEST_LIMIT: ${ASSISTANT_DAILY_REQUEST_LIMIT:-200}
      ASSISTANT_MINUTE_REQUEST_LIMIT: ${ASSISTANT_MINUTE_REQUEST_LIMIT:-6}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      ASSISTANT_BASE_URL: ${ASSISTANT_BASE_URL:-}
      ASSISTANT_ESCALATION_MINUTES: ${ASSISTANT_ESCALATION_MINUTES:-15}
      ASSISTANT_SUMMARY_HOUR: ${ASSISTANT_SUMMARY_HOUR:-8}
    healthcheck:
      test: ["CMD", "node", "--import", "tsx", "src/assistant/health.ts"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
